# Cornucopia generates a separate Rust crate at `crates/rampart-codegen` from the
# .sql files in `queries/`. Run `cornucopia live "$RAMPART_TEST_DB_URL"` to
# regenerate after schema or query changes. The resulting crate is
# committed and consumed by the main Rampart crate.

destination = "crates/rampart-codegen"

# Apply Serialize to every generated row struct so handlers can return
# them straight to axum's Json wrapper without a separate View struct.
[types]
derive-traits = [ "serde::Serialize" ]

# Map TIMESTAMPTZ → time::OffsetDateTime with RFC 3339 serde formatting.
# Postgres TIMESTAMPTZ binary support is built into tokio-postgres via
# `with-time-0_3`, so no FromSql/ToSql shim is needed. The Option<T>
# nullable variant uses the `::option` adapter.
[types.mapping."pg_catalog.timestamptz"]
attributes          = [ 'serde(with = "time::serde::rfc3339")' ]
attributes-nullable = [ 'serde(with = "time::serde::rfc3339::option")' ]
rust-type           = "time::OffsetDateTime"

# CITEXT columns get returned as plain Strings — match what our SELECTs
# already do via `::text AS col` casts, so the row layer is just String.
[types.mapping."public.citext"]
rust-type = "String"

[manifest.package]
name    = "rampart-codegen"
publish = false

[manifest.dependencies]
serde = { features = [ "derive" ], version = "1" }
time  = { features = [ "serde", "serde-well-known" ], version = "0.3" }

# Override Cornucopia's chrono default. Our type mapper sends TIMESTAMPTZ
# to time::OffsetDateTime, so the postgres clients need the matching
# with-time-0_3 feature to know how to bind that type.
[manifest.dependencies.postgres]
features = [ "with-time-0_3", "with-serde_json-1" ]
optional = true
version  = "0.19"

[manifest.dependencies.tokio-postgres]
default-features = false
features         = [ "with-time-0_3", "with-serde_json-1" ]
version          = "0.7"
