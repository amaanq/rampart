<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rampart — {{ heading }}</title>
    <link rel="stylesheet" href="/static/app.css?v=20260716">
</head>
<body>
<main class="auth">
    <a href="/" class="brand">rampart</a>
    <section class="auth-card">
        <h1>{{ heading }}</h1>
        <p class="auth-copy">{{ message }}</p>
        {%- if show_link %}
        <p class="auth-hint"><a href="{{ link_href }}">{{ link_label }}</a></p>
        {%- endif %}
    </section>
</main>
</body>
</html>
