<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rampart — {{ title }}</title>
    <link rel="stylesheet" href="/static/app.css?v=20260716">
    <script src="/static/auth.js?v=20260718" defer></script>
</head>
<body>
<main class="auth">
    <a href="/" class="brand">rampart</a>
    <section class="auth-card">
        <h1>{{ title }}</h1>
        <p class="auth-copy">{{ body }}</p>
        <form method="post" action="{{ action }}" class="auth-form" data-native-submit data-pending-label="{{ pending_label }}">
            <button type="submit" class="auth-submit">{{ button_label }}</button>
        </form>
    </section>
</main>
</body>
</html>
