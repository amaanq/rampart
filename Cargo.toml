[package]
name = "rampart"
version = "0.1.0"
edition = "2024"
description = "Self-hosted forward-only email alias manager, integrates with Stalwart via Sieve."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "rampart"
path = "src/lib.rs"

[[bin]]
name = "rampart"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "tokio", "http2"] }
tokio = {
	version = "1.53.0",
	features = [
		"rt-multi-thread",
		"macros",
		"signal",
		"fs",
		"io-util",
		"net",
	],
}
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "fs", "set-header"] }

tokio-postgres = {
	version = "0.7.18",
	features = [
		"with-time-0_3",
		"with-serde_json-1",
	],
}
rampart-codegen = { path = "db/rampart-codegen" }
deadpool-postgres = { version = "0.14.1", features = ["rt_tokio_1"] }
refinery = { version = "0.9.2", features = ["tokio-postgres"] }

askama = "0.16.0"

rust-argon2 = "3.0.0"
hmac-sha256 = "1.1.14"
constant_time_eq = "0.5.0"
data-encoding = "2.11.0"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
thiserror = "2.0.18"
anyhow = "1.0.103"

time = {
	version = "0.3.53",
	features = [
		"formatting",
		"serde",
		"serde-well-known",
	],
}
rand = "0.10.2"
hex = "0.4.3"
clap = { version = "4.6.2", features = ["derive", "env"] }
sd-notify = "0.5.0"
lru = "0.18.1"

lettre = {
	version = "0.11.22",
	default-features = false,
	features = [
		"builder",
		"smtp-transport",
		"tokio1-rustls-tls",
		"hostname",
		"pool",
	],
}

webauthn-rs = {
	version = "0.5.5",
	features = [
		"conditional-ui",
		"danger-allow-state-serialisation",
	],
}
url = "2.5.8"
hickory-resolver = "0.26.1"

mail-parser = "0.11.5"
async-trait = "0.1.89"

reqwest = {
	version = "0.13.4",
	default-features = false,
	features = [
		"rustls",
		"json",
	],
}

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction                      = { level = "warn", priority = -1 }

arbitrary_source_item_ordering  = "allow"
arithmetic_side_effects         = "allow"
as_conversions                  = "allow"
default_numeric_fallback        = "allow"
else_if_without_else            = "allow"
error_impl_error                = "allow"
exhaustive_structs              = "allow"
expect_used                     = "allow"
float_arithmetic                = "allow"
implicit_return                 = "allow"
indexing_slicing                = "allow"
integer_division                = "allow"
integer_division_remainder_used = "allow"
let_underscore_must_use         = "allow"
let_underscore_untyped          = "allow"
map_err_ignore                  = "allow"
missing_docs_in_private_items   = "allow"
missing_inline_in_public_items  = "allow"
mod_module_files                = "allow"
multiple_crate_versions         = "allow"
needless_borrowed_reference     = "allow"
non_ascii_literal               = "allow"
pub_use                         = "allow"
pub_with_shorthand              = "allow"
question_mark_used              = "allow"
ref_patterns                    = "allow"
semicolon_outside_block         = "allow"
separated_literal_suffix        = "allow"
shadow_reuse                    = "allow"
single_call_fn                  = "allow"
single_char_lifetime_names      = "allow"
std_instead_of_alloc            = "allow"
std_instead_of_core             = "allow"
string_slice                    = "allow"
too_many_lines                  = "allow"
unimplemented                   = "allow"
unreachable                     = "allow"
unwrap_in_result                = "allow"
unwrap_used                     = "allow"
wildcard_enum_match_arm         = "allow"
