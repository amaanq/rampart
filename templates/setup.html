<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rampart — first-run setup</title>
    <link rel="stylesheet" href="/static/app.css?v=20260716">
    <script src="/static/auth.js?v=20260718" defer></script>
</head>
<body>
<main class="auth">
    <a href="/" class="brand">rampart</a>
    <section class="auth-card">
        <h1>Welcome to rampart</h1>
        <p class="auth-hint">
            No accounts exist yet. Create the first admin to start managing aliases, mailboxes, and pool domains.
        </p>
        {% if let Some(e) = error %}
        <p class="auth-error" role="alert">{{ e }}</p>
        {% endif %}
        <form method="post" action="/setup" class="auth-form" data-native-submit data-pending-label="Creating admin…">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" autofocus required>
            <label for="display_name">Display name <span class="auth-optional">(optional)</span></label>
            <input id="display_name" name="display_name" type="text" autocomplete="name">
            <label for="password">Password <span class="auth-optional">(min 10 chars)</span></label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
            <button type="submit" class="auth-submit">Create admin account</button>
        </form>
    </section>
</main>
</body>
</html>
