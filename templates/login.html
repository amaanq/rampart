<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rampart — sign in</title>
    <link rel="stylesheet" href="/static/app.css?v=20260716">
    <script src="/static/webauthn.js?v=20260716" defer></script>
</head>
<body>
<main class="auth">
    <a href="/" class="brand">rampart</a>
    <section class="auth-card">
        <h1>Sign in</h1>
        {% if let Some(e) = error %}
        <p class="auth-error" role="alert">{{ e }}</p>
        {% endif %}
        <form method="post" action="/login" class="auth-form">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" autofocus required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit" class="auth-submit">Sign in</button>
        </form>
        <div class="auth-sep" role="separator"><span>or</span></div>
        <form id="passkey-login-form" class="auth-form auth-form-secondary">
            <button type="submit" class="auth-passkey">Sign in with passkey</button>
            <p class="auth-status" id="pk-login-status" data-passkey-status role="status" aria-live="polite"></p>
        </form>
        <p class="auth-hint">
            <a href="/auth/forgot">Forgot password?</a>
            <span class="auth-sep-dot" aria-hidden="true">·</span>
            <span>Invitation only</span>
        </p>
    </section>
</main>
</body>
</html>
