<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rampart — forgot password</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="auth">
    <a href="/" class="brand">rampart</a>
    <section class="auth-card">
        <h1>Reset password</h1>
        {% if sent %}
            <p>If that email is registered, a reset link has been sent.</p>
            <p class="auth-hint"><a href="/login">Back to sign in</a></p>
        {% else %}
            {% if let Some(e) = error %}<p class="auth-error" role="alert">{{ e }}</p>{% endif %}
            <form method="post" action="/auth/forgot" class="auth-form">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="username" autofocus required>
                <button type="submit" class="auth-submit">Send reset link</button>
            </form>
            <p class="auth-hint"><a href="/login">Back to sign in</a></p>
        {% endif %}
    </section>
</main>
</body>
</html>
