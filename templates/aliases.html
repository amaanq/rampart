{% extends "layout.html" %}
{% block title %}aliases{% endblock %}
{% block body %}
<section class="card">
    <h2>new random alias</h2>
    <form hx-post="/api/v1/alias/random" hx-ext="json-enc">
        <label>domain <select name="domain">
            {%- for d in domains %}
            <option value="{{ d.domain }}">{{ d.domain }}{% if d.shared %} (shared){% endif %}</option>
            {%- endfor %}
        </select></label>
        <label>note <input type="text" name="note"></label>
        <button type="submit">create</button>
    </form>
</section>

<section class="card">
    <h2>new custom alias</h2>
    <form hx-post="/api/v1/alias/custom/new" hx-ext="json-enc">
        <label>prefix <input type="text" name="alias_prefix" required pattern="[A-Za-z0-9._+\-]+" placeholder="e.g. github"></label>
        <label>domain <select name="domain">
            {%- for d in domains %}
            <option value="{{ d.domain }}">{{ d.domain }}{% if d.shared %} (shared){% endif %}</option>
            {%- endfor %}
        </select></label>
        <label>note <input type="text" name="note"></label>
        <button type="submit">create</button>
    </form>
</section>

<section>
    <h2>your aliases ({{ total }})</h2>
    <table>
        <thead>
            <tr><th>address</th><th>forward to</th><th>note</th><th>fwd</th><th>last</th><th></th></tr>
        </thead>
        <tbody id="alias-list">
        {%- for a in aliases %}
            {% include "_alias_row.html" %}
        {%- endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
