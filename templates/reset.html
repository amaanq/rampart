<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rampart — reset password</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="auth">
    <a href="/" class="brand">rampart</a>
    <section class="auth-card">
        <h1>Set new password</h1>
        {% if let Some(e) = error %}<p class="auth-error" role="alert">{{ e }}</p>{% endif %}
        <form method="post" action="/auth/reset/{{ token }}" class="auth-form">
            <label for="password">New password <span class="auth-optional">(min 10 chars)</span></label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required autofocus>
            <button type="submit" class="auth-submit">Set password</button>
        </form>
    </section>
</main>
</body>
</html>
