<tr id="alias-{{ a.id }}" class="{% if !a.enabled %}disabled{% endif %}">
    <td><code>{{ a.address }}</code></td>
    <td>{{ a.mailbox.email }}</td>
    <td>{{ a.note.as_deref().unwrap_or("") }}</td>
    <td>{{ a.nb_forward }}</td>
    <td>{% if let Some(t) = a.last_email_at %}<time class="timestamp" datetime="{{ t|datetime_attribute }}">{{ t|ui_datetime }}</time>{% endif %}</td>
    <td>
        <div class="alias-actions">
            <a class="alias-action-link" href="/aliases/{{ a.id }}/contacts">contacts</a>
            <a class="alias-action-link" href="/aliases/{{ a.id }}/activity">activity</a>
            <button class="secondary"
                    hx-put="/api/v1/aliases/{{ a.id }}/toggle"
                    hx-disabled-elt="this"
                    data-reload="no"
                    data-toggle-closest="tr"
                    data-toggle-class="disabled"
                    data-label-with-class="enable"
                    data-label-without-class="disable"
>
                {% if a.enabled %}disable{% else %}enable{% endif %}
            </button>
            <button class="danger"
                    aria-label="Delete alias {{ a.address }}"
                    hx-delete="/api/v1/aliases/{{ a.id }}"
                    data-reload="no"
                    data-remove-closest="tr"
                    data-count-target="#alias-count"
                    hx-confirm="delete {{ a.address }}?"
>delete</button>
        </div>
    </td>
</tr>
