name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.10.7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: cargo fmt
        run: nix develop --command cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.10.7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: cargo clippy
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAMPART_TEST_DB_URL: host=localhost user=postgres password=postgres dbname=postgres
      RAMPART_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.10.7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: cargo test (DB-backed, hard gate)
        run: nix develop --command cargo test --locked

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          manifest-path: Cargo.toml
          command: check

  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.10.7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Codegen drift check
        run: nix flake check --print-build-logs
      - name: Build package (wild linker)
        run: nix build .#default --print-build-logs
